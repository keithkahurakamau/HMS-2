# Render Blueprint — HMS backend
#
# Superadmin bootstrap is COMPLETE for production. The original
# backend/seed_superadmin.py has been removed from the repo; render-start.sh
# now skips the seed step entirely (its `if -f` guard sees no file).
# Resetting the platform to a fresh state in the future means restoring
# seed_superadmin.py from git history AND running scripts/reset_production_db.py
# under the gated RESET_PRODUCTION_DB env flag.
#
# Required environment variables (set as secrets in the Render dashboard):
#   DATABASE_URL              — managed Postgres connection string
#   SECRET_KEY                — JWT signing key (>=32 bytes high entropy)
#   ENCRYPTION_KEY            — Fernet key for at-rest secrets (44-char b64)
#   PUBLIC_BASE_URL           — https://hms-2-3o0p.onrender.com (callback URL)
#   PAYHERO_USERNAME / PAYHERO_PASSWORD / PAYHERO_CHANNEL_ID — aggregator creds
#   PAYHERO_WEBHOOK_SECRET    — HMAC shared secret for incoming callbacks
#   PAYHERO_WEBHOOK_CIDRS     — comma-separated allow-list (e.g. 196.201.0.0/16)
#   PASSWORD_PEPPER           — server-side pepper added before Argon2id hash

services:
  - type: web
    name: hms-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Invoke via `bash` explicitly so the executable bit on the file isn't
    # required (git mode bits get lost on Windows checkouts and mode-stripping
    # archive uploads). Render's working directory is set by `rootDir` above,
    # so this resolves to backend/render-start.sh.
    startCommand: bash render-start.sh
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Authoritative production flag. Drives cookie security flags
      # (secure=true, samesite=none) so the Vercel-hosted frontend can
      # round-trip the HttpOnly session cookie through the Render API
      # over HTTPS. Without this set, cookies are issued with samesite=lax
      # and the cross-domain login silently fails after a refresh.
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Fernet key for at-rest secret encryption (per-tenant Pay Hero
      # credentials, future encrypted fields). 44-byte URL-safe base64.
      # MUST be declared here as sync:false — otherwise a blueprint resync
      # silently drops the dashboard value and the next deploy crashes at
      # `Settings()` construction (settings.py refuses to boot without it).
      # NEVER use generateValue:true here — rotating this key makes every
      # previously-encrypted row permanently unreadable.
      - key: ENCRYPTION_KEY
        sync: false
      # Server-side pepper HMACed into passwords before Argon2id. Same
      # warning applies: regenerating invalidates every existing login.
      - key: PASSWORD_PEPPER
        sync: false
      # Callback URL Pay Hero hits for STK push results. Production value:
      # https://hms-2-3o0p.onrender.com (the canonical Render host).
      - key: PUBLIC_BASE_URL
        sync: false
      # Pay Hero aggregator credentials. All four required for the live
      # PAYHERO_ENV=production path; empty values force sandbox behaviour.
      - key: PAYHERO_ENV
        sync: false
      - key: PAYHERO_USERNAME
        sync: false
      - key: PAYHERO_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_WEBHOOK_SECRET
        sync: false
      - key: PAYHERO_WEBHOOK_CIDRS
        sync: false
      # Lock CORS to the production SPA hostnames. CORS allow-lists are not
      # secrets, so hardcoding here keeps the blueprint authoritative and
      # the migration durable across redeploys. Order: canonical www, apex
      # (covers the 308 round-trip where some browsers send Origin before
      # following the redirect), then the legacy vercel.app alias used by
      # preview deployments. Add preview-specific origins via the dashboard
      # when needed; dashboard-set values still win against the blueprint.
      - key: CORS_ORIGINS
        value: "https://www.medifleet.app,https://medifleet.app,https://hms-2-psi.vercel.app"
      # Redis URL for WebSocket pub/sub fan-out across workers. OPTIONAL for a
      # single worker, REQUIRED once WEB_CONCURRENCY > 1 (otherwise real-time
      # notifications/payments don't span workers). Provision a Render Key Value
      # (Redis) instance and paste its URL here.
      - key: REDIS_URL
        sync: false
      # ── Horizontal scale-up knobs ─────────────────────────────────────────
      # Number of gunicorn worker processes (render-start.sh). Left at 1 so the
      # default deploy is unchanged. To serve many hospitals concurrently:
      #   1. Bump this service's `plan` above (starter = 0.5 CPU / 512MB; a
      #      worker wants ~0.5–1 CPU, so 4 workers ≈ a 2–4 CPU plan).
      #   2. Set REDIS_URL (above).
      #   3. Front Postgres with PgBouncer in transaction mode, point
      #      DATABASE_URL at it (port 6432), and flip DB_POOLER_ENABLED to
      #      "true" below — see docs/DEPLOYMENT.md §1 + deploy/pgbouncer/.
      #   4. Set WEB_CONCURRENCY to roughly (2 × vCPU) and, if the DB budget
      #      allows, raise THREADPOOL_TOKENS in step with PgBouncer's pool.
      # When true, every SQLAlchemy engine uses NullPool (the pooler owns
      # pooling). Keep "false" when DATABASE_URL points straight at Postgres.
      - key: DB_POOLER_ENABLED
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SEED_SUPERADMIN_EMAIL
        sync: false
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false

  # Daily billing run: raises subscription invoices that have come due and
  # sends overdue reminders. Same idempotent code path as the operator
  # console's "Run billing now" button (app/services/subscription_billing.py),
  # serialised against it with a Postgres advisory lock so the two can never
  # collide.
  #
  # 03:00 UTC = 06:00 EAT, before the Kenyan working day starts.
  #
  # This blueprint has no envVarGroups; the web service above declares its
  # environment inline, so this cron service mirrors that pattern rather
  # than referencing a group that does not exist. Settings() (app/config/
  # settings.py) fails fast if SECRET_KEY, ENCRYPTION_KEY, or (in production)
  # CORS_ORIGINS/PASSWORD_PEPPER are missing, so this needs the same
  # variables as hms-backend, not just DATABASE_URL.
  - type: cron
    name: medifleet-billing
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.cli.run_billing
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: PASSWORD_PEPPER
        sync: false
      - key: CORS_ORIGINS
        value: "https://www.medifleet.app,https://medifleet.app,https://hms-2-psi.vercel.app"

  # Daraja reconciliation: resolves STK pushes stuck Pending, C2B receipts
  # stuck Unverified, and B2C refunds stuck Processing (or Approved with a
  # dispatch attempt already marked) by asking Safaricom directly, never by
  # guessing locally. Anything still unresolved after 24 hours is surfaced
  # rather than retried forever. Same idempotent-run shape as
  # medifleet-billing above: serialised against itself (and any future
  # operator console "Run reconciliation now" button) with its own
  # Postgres advisory lock (app/services/daraja/reconcile.py's
  # reconcile_lock), so overlapping runs skip rather than race.
  #
  # Every 15 minutes: STK Pending and C2B Unverified rows are only acted on
  # once they are 5+ minutes old, and refunds once 10+ minutes old, so a
  # 15-minute cadence catches each as soon as it is eligible without
  # hammering Safaricom on a still-genuinely-in-flight payment.
  #
  # IMPORTANT: DATABASE_URL is sync: false, same as medifleet-billing, and
  # MUST be set in the Render dashboard. Unlike a code bug, an unset value
  # here does not crash the job: it simply finds an empty (or wrong) tenant
  # registry and exits 0, which looks exactly like a healthy "nothing was
  # stuck" run. ENCRYPTION_KEY must likewise be set: every Daraja call this
  # job makes decrypts a tenant's stored credentials first.
  - type: cron
    name: medifleet-daraja-reconcile
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.cli.run_reconcile
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: PASSWORD_PEPPER
        sync: false
      - key: CORS_ORIGINS
        value: "https://www.medifleet.app,https://medifleet.app,https://hms-2-psi.vercel.app"
