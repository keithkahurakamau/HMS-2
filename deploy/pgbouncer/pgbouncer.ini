; PgBouncer configuration for MediFleet — multi-tenant, transaction pooling.
;
; MediFleet runs ONE Postgres database per tenant (plus hms_master), and the
; app opens engines against tenant DB names taken from the X-Tenant-ID header.
; PgBouncer must therefore proxy ANY database on the upstream server — hence the
; wildcard [databases] entry below. Full rationale: docs/DEPLOYMENT.md §1.
;
; Local rehearsal:  docker compose --profile pgbouncer up   (uses plain auth
; against the compose Postgres). For PRODUCTION, harden the two auth lines as
; noted inline (scram-sha-256 + a hashed userlist) — see deploy/pgbouncer/README.md.

[databases]
; Wildcard: forward every database to the upstream Postgres, so each tenant DB
; (mayoclinic_db, hms_master, …) is pooled without a per-tenant entry.
; `host` is the compose service name — override PGB_UPSTREAM_HOST/PORT for your infra.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; ── Auth ──────────────────────────────────────────────────────────────────
; DEV (compose): plain userlist with the compose Postgres creds.
; PROD: set `auth_type = scram-sha-256` and ship a hashed userlist.txt
;       (deploy/pgbouncer/README.md shows how). Never run plain auth in prod.
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; ── Pooling ───────────────────────────────────────────────────────────────
; transaction mode: a server connection returns to the pool at COMMIT/ROLLBACK,
; so a small server pool serves many app connections. The app avoids
; cross-transaction session state; the OP-number lock uses pg_advisory_xact_lock
; (transaction-scoped) which is released at COMMIT and is therefore pooler-safe.
pool_mode = transaction

; Client-facing capacity across all app workers/replicas × their thread pools.
max_client_conn = 2000
; Server connections per (user, database) pair. With many tenant DBs, total
; upstream connections ≈ default_pool_size × active DBs — keep it modest and
; cap it with max_db_connections so Postgres max_connections isn't exhausted.
default_pool_size = 25
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 0
server_idle_timeout = 600

; psycopg2/SQLAlchemy send these startup params; PgBouncer must pass them through
; rather than reject the connection in transaction mode.
ignore_startup_parameters = extra_float_digits,options

; Wipe any session state before a server connection is reused by another client.
server_reset_query = DISCARD ALL
log_connections = 0
log_disconnections = 0
